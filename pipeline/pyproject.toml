[project]
name = "flux-pipeline"
version = "0.1.0"
description = "Content build: parses FM 21-76 into anchored records and packs them for the server"
authors = [
    { email = "105625351+reversely@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "osmium>=4.3.1",
    "pdfplumber>=0.11.7",
    "pillow>=12.3.0",
]

[project.scripts]
flux-pipeline = "flux_pipeline.__main__:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
