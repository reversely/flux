[project]
name = "flux-server"
version = "0.1.0"
description = "Stub inference server returning canned PRD-schema inspection results"
authors = [
    { email = "105625351+reversely@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
flux-server = "flux_server.__main__:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]
